# Docker Compose para PostgreSQL 17 — Transporte Público
# Para iniciar: docker compose -f docker-compose.postgres.yml up -d
# Para detener: docker compose -f docker-compose.postgres.yml down

name: api-transporte-publico-postgres

services:
  postgres:
    image: postgres:17
    container_name: transporte_postgres
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    ports:
      - "${PUERTO_DB:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

volumes:
  postgres:
